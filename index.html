<head> 
    <title>PeakRoom</title>
</head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #070712;
            color: white;
        }

        /* NAVIGATION */
        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            background: rgba(10, 10, 22, 0.95);
            border-bottom: 1px solid #202033;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #7c5cff;
        }

        nav a {
            color: #bbb;
            text-decoration: none;
            margin-left: 25px;
            transition: 0.2s;
        }

        nav a:hover {
            color: white;
        }

        /* HERO */
        .hero {
            min-height: 430px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 20px;

            background:
                radial-gradient(circle at 20% 50%, #25205a 0%, transparent 35%),
                radial-gradient(circle at 80% 50%, #351449 0%, transparent 35%),
                linear-gradient(135deg, #080812, #111126, #080812);
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: clamp(45px, 8vw, 85px);
            margin-bottom: 15px;
            background: linear-gradient(90deg, #8b6cff, #d56cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: #aaa;
            font-size: 20px;
            margin-bottom: 30px;
        }

        .search {
            width: min(600px, 90%);
            padding: 17px 22px;
            border-radius: 12px;
            border: 1px solid #33334d;
            background: #11111e;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .search:focus {
            border-color: #8066ff;
        }

        /* MAIN */
        main {
            width: 90%;
            max-width: 1250px;
            margin: 50px auto;
        }

        .section-title {
            font-size: 30px;
            margin-bottom: 25px;
        }

        /* CATEGORIES */
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .category {
            border: 1px solid #303047;
            background: #11111d;
            color: #bbb;
            padding: 10px 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }

        .category:hover,
        .category.active {
            background: #765cff;
            color: white;
            border-color: #765cff;
        }

        /* GAME GRID */
        .games {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .game-card {
            background: #11111d;
            border: 1px solid #24243a;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.25s;
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-7px);
            border-color: #765cff;
            box-shadow: 0 10px 35px rgba(118, 92, 255, 0.18);
        }

        .game-image {
            height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;

            background:
                linear-gradient(135deg, #202052, #421c4c);
        }

        .game-info {
            padding: 18px;
        }

        .game-info h3 {
            margin-bottom: 7px;
        }

        .game-info p {
            color: #888;
            font-size: 14px;
        }

        .play-button {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #765cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .play-button:hover {
            background: #8b75ff;
        }

        /* FOOTER */
        footer {
            margin-top: 80px;
            padding: 35px;
            text-align: center;
            color: #666;
            border-top: 1px solid #202033;
        }

        /* MOBILE */
        @media (max-width: 600px) {
            nav {
                padding: 0 20px;
            }

            nav a {
                display: none;
            }

            .hero {
                min-height: 400px;
            }

            .games {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .game-image {
                height: 110px;
            }
        }
    </style>
</head>

<body>

<!DOCTYPE html>
<html>
<head>
  <title>Pong</title>
  <style>
    body {
      margin: 0;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      border: 3px solid white;
      background: black;
    }
  </style>
</head>
<body>

<canvas id="pong" width="800" height="500"></canvas>

<script>
const canvas = document.getElementById("pong");
const ctx = canvas.getContext("2d");

const paddleWidth = 12;
const paddleHeight = 90;

let playerY = canvas.height / 2 - paddleHeight / 2;
let computerY = canvas.height / 2 - paddleHeight / 2;

let ballX = canvas.width / 2;
let ballY = canvas.height / 2;
let ballSpeedX = 5;
let ballSpeedY = 4;

let playerScore = 0;
let computerScore = 0;

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Middle line
  ctx.setLineDash([10, 10]);
  ctx.strokeStyle = "white";
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  ctx.fillStyle = "white";
  ctx.fillRect(20, playerY, paddleWidth, paddleHeight);
  ctx.fillRect(
    canvas.width - 32,
    computerY,
    paddleWidth,
    paddleHeight
  );

  // Ball
  ctx.beginPath();
  ctx.arc(ballX, ballY, 9, 0, Math.PI * 2);
  ctx.fill();

  // Score
  ctx.font = "40px Arial";
  ctx.fillText(playerScore, canvas.width / 2 - 70, 50);
  ctx.fillText(computerScore, canvas.width / 2 + 45, 50);
}

function update() {
  ballX += ballSpeedX;
  ballY += ballSpeedY;

  if (ballY <= 0 || ballY >= canvas.height) {
    ballSpeedY *= -1;
  }

  // Player paddle
  if (
    ballX < 32 &&
    ballY > playerY &&
    ballY < playerY + paddleHeight
  ) {
    ballSpeedX *= -1;
  }

  // Computer paddle
  if (
    ballX > canvas.width - 44 &&
    ballY > computerY &&
    ballY < computerY + paddleHeight
  ) {
    ballSpeedX *= -1;
  }

  // Computer AI
  computerY += (ballY - (computerY + paddleHeight / 2)) * 0.08;

  // Score
  if (ballX < 0) {
    computerScore++;
    resetBall();
  }

  if (ballX > canvas.width) {
    playerScore++;
    resetBall();
  }
}

function resetBall() {
  ballX = canvas.width / 2;
  ballY = canvas.height / 2;
  ballSpeedX *= -1;
}

canvas.addEventListener("mousemove", function(event) {
  const rect = canvas.getBoundingClientRect();
  playerY = event.clientY - rect.top - paddleHeight / 2;

  playerY = Math.max(
    0,
    Math.min(canvas.height - paddleHeight, playerY)
  );
});

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>

    <!-- JAVASCRIPT -->
    <script>

        function playGame(url) {
            window.location.href = url;
        }


        // GAME SEARCH

        const search = document.getElementById("search");

        const cards = document.querySelectorAll(".game-card");

        search.addEventListener("input", function () {

            const query = search.value.toLowerCase();

            cards.forEach(card => {

                const name =
                    card.dataset.name.toLowerCase();

                if (name.includes(query)) {
                    card.style.display = "";
                } else {
                    card.style.display = "none";
                }

            });

        });


        // CATEGORY BUTTONS

        const categories =
            document.querySelectorAll(".category");

        categories.forEach(button => {

            button.addEventListener("click", () => {

                categories.forEach(b =>
                    b.classList.remove("active")
                );

                button.classList.add("active");

            });

        });

    </script>
